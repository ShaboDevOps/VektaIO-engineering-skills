name: CI (api)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions: {}
concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-api:
    name: ci-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: __WORKDIR_API__
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just ci

  api-contract:
    name: api-contract
    # Release gate: migrations apply on a fresh DB and the OpenAPI contract has no unversioned breaking changes.
    if: github.base_ref == 'main'
    needs: ci-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: __WORKDIR_API__
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      - run: just release-check
