name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [develop, main]
permissions: {}
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: claude-review
    # Skipped (counts as passing) for drafts, forks, Dependabot, release-please and back-merge PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--') &&
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # or: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/ShaboDevOps/VektaIO-engineering-skills.git
          plugins: |
            vekta-core@vektaio-skills
__STACK_PLUGINS__
          prompt: "/vekta-core:review-pr ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --ci"
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Read,Grep,Glob,Write"
      - name: Enforce Claude verdict
        run: |
          if [ ! -f .claude-review-verdict ]; then echo "::error::Claude did not produce a verdict"; exit 1; fi
          verdict="$(tr -d '[:space:]' < .claude-review-verdict)"
          echo "Claude verdict: $verdict"
          [ "$verdict" = "PASS" ] || { echo "::error::Claude review found blocking issues — see PR comments"; exit 1; }
