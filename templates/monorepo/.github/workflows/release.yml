name: Release
# On main: release-please keeps one Release PR with a version bump per app that changed.
# Merging it tags api-vX.Y.Z / web-vX.Y.Z / mobile-vX.Y.Z and deploys only those apps to production.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      api: ${{ steps.release.outputs['apps/api--release_created'] }}
      api_tag: ${{ steps.release.outputs['apps/api--tag_name'] }}
      web: ${{ steps.release.outputs['apps/web--release_created'] }}
      web_tag: ${{ steps.release.outputs['apps/web--tag_name'] }}
      mobile: ${{ steps.release.outputs['apps/mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['apps/mobile--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-api:
    needs: release-please
    if: needs.release-please.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.api_tag }}
          persist-credentials: false
      - uses: extractions/setup-just@v3
      # TODO: cloud login (OIDC preferred)
      - run: just deploy production
        env:
          APP_VERSION: ${{ needs.release-please.outputs.api_tag }}

  deploy-web:
    needs: [release-please, deploy-api]
    if: always() && needs.release-please.outputs.web == 'true' && needs.deploy-api.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.web_tag }}
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - run: just deploy production
        env:
          APP_VERSION: ${{ needs.release-please.outputs.web_tag }}

  deploy-mobile:
    # Uploads to Play production (staged rollout) and App Store (phased release).
    needs: [release-please, deploy-api]
    if: always() && needs.release-please.outputs.mobile == 'true' && needs.deploy-api.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.mobile_tag }}
          persist-credentials: false
      - uses: extractions/setup-just@v3
      - run: just deploy production

  back-merge:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open main -> develop PR if develop is behind
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          git fetch origin develop main
          if [ "$(git rev-list --count origin/develop..origin/main)" = "0" ]; then echo "develop already contains main"; exit 0; fi
          existing="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then echo "Back-merge PR #$existing already open"; exit 0; fi
          gh pr create --base develop --head main --title "chore: back-merge main into develop" \
            --body "Automatic back-merge after a release or patch on \`main\`. Merge with a **merge commit**."
